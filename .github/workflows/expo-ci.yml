name: Expo CI

on:
  push:
    branches: [main, feature/products]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and validate Expo project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use tested npm version
        run: npm install --global npm@10.9.3

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run Expo Doctor
        run: npx --yes expo-doctor
